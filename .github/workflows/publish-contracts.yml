name: Publish contracts

on:
  push:
    tags: ["contracts-v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Attach contract specs to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with the specs attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            packages/contracts/openapi/erp-commerce-v1.yaml \
            packages/contracts/asyncapi/erp-events-v1.yaml \
            --title "${{ github.ref_name }}" \
            --notes "Contract release. Downstream repositories pin this tag and validate against these files in their own pipelines."
